[project]
name = "fnirsi1013d"
version = "0.1.0"
description = "Host library, device simulator and MCP server for the FNIRSI 1013D open-firmware USB protocol"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12,<2",
    "pyserial>=3.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.5"]

[project.scripts]
fnirsi1013d-mcp = "fnirsi1013d.server:main"
fnirsi1013d-sim = "fnirsi1013d.simulator:main"
fnirsi1013d-flash = "fnirsi1013d.flash:main"
fnirsi1013d-bench = "fnirsi1013d.bench:main"
fnirsi1013d-sd = "fnirsi1013d.sdcli:main"
fnirsi1013d-soak = "fnirsi1013d.soak:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnirsi1013d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
