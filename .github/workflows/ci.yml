# CI: firmware (GCC 10 + GCC 13 builds, host tests), mcp (ruff + pytest on Linux and Windows, the wheel in a
# fresh venv), shared protocol vectors. Also called by release.yml (workflow_call), which then downloads the
# firmware-image artifact. docs/releasing.md describes both workflows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Pushes get one group per commit, so no commit on main loses its run. With one group per ref, a newer
# pending run replaces an older pending one (seen on the first day, with several agents pushing).
# Pull requests keep one group per PR and cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    name: firmware
    # Pinned: the documented toolchain is Ubuntu 24.04's arm-none-eabi GCC 13.2.1 (firmware/README.md).
    # GCC 14 turns an upstream implicit declaration in menu.c into an error.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/firmware-build
      - name: Upload firmware image
        uses: actions/upload-artifact@v6
        with:
          name: firmware-image
          path: dist-firmware/
          if-no-files-found: error
          retention-days: 30

  mcp:
    name: mcp (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu pinned like the firmware job (ubuntu-latest moves to Ubuntu 26 from 2026-10-19)
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - name: Install fnirsi1013d with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: ruff (the selection mcp/AGENTS.md uses)
        run: ruff check --select F,E9,B023 --line-length 120 src tests
      - name: pytest (simulator over TCP and stdio subprocesses; no hardware)
        timeout-minutes: 10
        run: python -m pytest -q -p no:cacheprovider

  wheel:
    # The wheel as a user gets it (built like release.yml does), installed into a fresh venv outside the checkout:
    # fnirsi1013d-mcp --list-tools, an MCP stdio session against the in-process simulator, files under
    # FNIRSI_MCP_HOME, clear errors for the checkout-only inputs (.github/scripts/wheel_smoke.py).
    name: mcp wheel in a fresh venv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheel (as release.yml)
        run: |
          python -m pip install --upgrade pip build
          python -m build mcp --outdir dist
      - name: Install into a fresh venv and run the server from it
        run: python .github/scripts/wheel_smoke.py --wheel dist/fnirsi1013d-*.whl

  docs-lint:
    name: protocol vectors and CHANGELOG
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - name: Install fnirsi1013d
        run: python -m pip install -e ./mcp
      - name: docs/protocol-vectors.json against the Python parsers
        run: python -m fnirsi1013d.vectors --check --file docs/protocol-vectors.json
      - name: docs/protocol-vectors.json against the C parser (firmware/scope/pc_protocol.c)
        run: |
          make -C firmware/scope/host_tests build/vector_check
          python3 -I firmware/scope/host_tests/check_vectors.py \
            --checker firmware/scope/host_tests/build/vector_check --vectors docs/protocol-vectors.json
      - name: CHANGELOG.md structure
        run: python3 .github/scripts/release_meta.py --check-changelog
